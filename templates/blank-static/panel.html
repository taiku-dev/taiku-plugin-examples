<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        background: rgb(var(--tk-bg, 10 10 12));
        color: rgb(var(--tk-ink, 244 244 245));
        font-family: var(--tk-font-ui, sans-serif);
        padding: 12px;
      }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <p>Current session</p>
    <pre id="session">Waiting for taiku.</pre>
    <script>
      const host = window.parent;
      let identity = null;
      let port = null;
      let nextId = 0;
      const pending = new Map();

      function applyTheme(theme) {
        for (const [key, value] of Object.entries(theme?.tokens || {}))
          document.documentElement.style.setProperty(key, value);
      }

      function receive(data) {
        if (data?.type === "taiku:theme") applyTheme(data.theme);
        if (data?.type !== "taiku:response" || !pending.has(data.id)) return;
        const { resolve, reject } = pending.get(data.id);
        pending.delete(data.id);
        data.error ? reject(new Error(data.error)) : resolve(data.result);
      }

      function call(method, params = {}) {
        const id = "request_" + ++nextId;
        const { pluginId, panelId, authToken } = identity;
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
          const message = {
            type: "taiku:request", id, pluginId, panelId, authToken, method, params,
          };
          if (port) port.postMessage(message);
          else host.postMessage(message, "*");
        });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== host) return;
        const data = event.data;
        if (data?.type !== "taiku:init") {
          receive(data);
          return;
        }
        identity = data;
        applyTheme(data.theme);
        if (port) port.close();
        port = event.ports?.[0] || null;
        if (port) {
          port.onmessage = (event) => receive(event.data);
          port.postMessage({ type: "taiku:port-ready" });
        }
        call("getSession").then(
          (session) => {
            document.getElementById("session").textContent = JSON.stringify(session, null, 2);
          },
          (error) => {
            document.getElementById("session").textContent = error.message;
          },
        );
      });
    </script>
  </body>
</html>
