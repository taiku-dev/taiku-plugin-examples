<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: rgb(var(--tk-bg, 10 10 12));
        color: rgb(var(--tk-ink-secondary, 205 208 214));
        font-family:
          Helvetica, "Helvetica Neue", "Nimbus Sans", Arial, sans-serif;
        font-size: 12px;
        padding: 8px;
        overflow-y: auto;
        height: 100vh;
      }
      .path-bar {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-bottom: 8px;
        padding: 4px 6px;
        background: rgb(var(--tk-surface-2, 32 32 37));
        border-radius: 4px;
        font-size: 11px;
        font-family: ui-monospace, monospace;
        color: rgb(var(--tk-ink-secondary, 205 208 214));
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .path-bar::-webkit-scrollbar {
        display: none;
      }
      .path-bar button {
        background: none;
        border: none;
        color: rgb(var(--tk-accent, 46 143 255));
        cursor: pointer;
        font-size: 11px;
        font-family: inherit;
        padding: 0;
      }
      .path-bar button:hover {
        text-decoration: underline;
      }
      .file-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
      }
      .file-row:hover {
        background: rgb(var(--tk-surface-2, 32 32 37));
      }
      .file-icon {
        width: 14px;
        text-align: center;
        flex-shrink: 0;
      }
      .file-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgb(var(--tk-ink, 244 244 245));
      }
      .dir .file-name {
        color: rgb(var(--tk-accent, 46 143 255));
      }
      .empty {
        color: rgb(var(--tk-ink-faint, 82 82 91));
        text-align: center;
        padding: 24px 0;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="path-bar" id="path-bar">.</div>
    <div class="file-list" id="file-list">
      <p class="empty">Loading...</p>
    </div>
    <script>
      // The host hands this document a port with init. Requests go on it,
      // and its answers and events come back on it, re-dispatched here as the
      // host's messages: a port reaches only the document that received it.
      let taikuPort = null;
      function taikuPost(msg) {
        if (taikuPort) taikuPort.postMessage(msg);
        else window.parent.postMessage(msg, "*");
      }
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:init") return;
        const port = e.ports && e.ports[0];
        if (!port) return;
        if (taikuPort) taikuPort.close();
        taikuPort = port;
        // Events move to the port from here on, before any request.
        port.postMessage({ type: "taiku:port-ready" });
        port.onmessage = (ev) => {
          if (ev.data?.type === "taiku:init") return;
          window.dispatchEvent(
            new MessageEvent("message", {
              data: ev.data,
              source: window.parent,
            }),
          );
        };
      });
      let pluginId = "",
        panelId = "",
        authToken = "",
        reqId = 0,
        currentPath = ".";
      const hostWindow = window.parent;

      /** Normalize a path: resolve `.`, `..`, collapse `//`, return `.` for root. */
      function normalizePath(p) {
        const parts = p.split("/").filter(Boolean);
        const resolved = [];
        for (const seg of parts) {
          if (seg === ".") continue;
          if (seg === "..") {
            resolved.pop(); // go up — if empty, stays empty (root)
          } else {
            resolved.push(seg);
          }
        }
        return resolved.length === 0 ? "." : resolved.join("/");
      }

      function send(method, params) {
        const id = "fb_" + ++reqId;
        taikuPost({
          type: "taiku:request",
          id,
          pluginId,
          panelId,
          authToken,
          method,
          params,
        });
        return id;
      }

      function sendAsync(method, params) {
        return new Promise((resolve, reject) => {
          const id = send(method, params);
          const handler = (e) => {
            if (e.source !== hostWindow) return;
            const d = e.data;
            if (d?.panelId && panelId && d.panelId !== panelId) return;
            if (d?.type === "taiku:response" && d.id === id) {
              window.removeEventListener("message", handler);
              if (d.error) reject(new Error(d.error));
              else resolve(d.result);
            }
          };
          window.addEventListener("message", handler);
          setTimeout(() => {
            window.removeEventListener("message", handler);
            reject(new Error("Timeout"));
          }, 10000);
        });
      }

      async function listDir(rawPath) {
        const path = normalizePath(rawPath);
        currentPath = path;
        // Escape before anything reaches innerHTML.
        //
        // Every value below is a FILENAME or a path built from filenames, and
        // the session owner does not choose them - a repo, an npm install or an
        // upload does. A file called `<img src=x onerror=...>` executed inside
        // this panel's iframe, which holds the plugin's own fs.read permission,
        // so a crafted name could read files and ship them out. The quotes
        // matter as much as the angle brackets: these values are also
        // interpolated into `data-name="..."` attributes, where a bare `"`
        // ends the attribute and starts a new one.
        const esc = (v) =>
          String(v ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const pathBar = document.getElementById("path-bar");

        // Build clickable breadcrumbs: ~ / foo / bar / baz
        let breadcrumb = `<button data-nav="." aria-label="Session root" data-taiku-tip="Session root">~</button>`;
        if (path !== ".") {
          const segments = path.split("/");
          segments.forEach((seg, i) => {
            const partial = segments.slice(0, i + 1).join("/");
            breadcrumb += ` / <button data-nav="${esc(partial)}">${esc(seg)}</button>`;
          });
        }
        pathBar.innerHTML = breadcrumb;

        const fileList = document.getElementById("file-list");
        fileList.innerHTML = '<p class="empty">Loading...</p>';

        try {
          const entries = await sendAsync("listDir", { path });

          // Parent: go up one level, or stay at root
          const parentPath = path === "." ? "." : normalizePath(path + "/..");
          let html = "";
          if (path !== ".") {
            html += `<div class="file-row dir" data-name=".." data-dir="true" data-path="${esc(parentPath)}">
        <span class="file-icon">&#128194;</span><span class="file-name">..</span></div>`;
          }

          if (entries && entries.length) {
            entries.sort((a, b) => {
              if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;
              return a.name.localeCompare(b.name);
            });
            html += entries
              .map((e) => {
                const fp = path === "." ? e.name : path + "/" + e.name;
                return `<div class="file-row ${
                  e.isDir ? "dir" : ""
                }" data-name="${esc(e.name)}" data-dir="${
                  e.isDir
                }" data-path="${esc(fp)}">
        <span class="file-icon">${
          e.isDir ? "&#128193;" : "&#128196;"
        }</span><span class="file-name">${esc(e.name)}</span></div>`;
              })
              .join("");
          } else {
            html +=
              '<p class="empty" style="padding:12px 0">Empty directory</p>';
          }
          fileList.innerHTML = html;
        } catch (err) {
          const parentPath = path === "." ? "." : normalizePath(path + "/..");
          let html = "";
          if (path !== ".") {
            html += `<div class="file-row dir" data-name=".." data-dir="true" data-path="${esc(parentPath)}">
        <span class="file-icon">&#128194;</span><span class="file-name">..</span></div>`;
          }
          html += `<p class="empty" style="color:rgb(var(--tk-danger, 248 113 113))">${esc(err.message)}</p>`;
          fileList.innerHTML = html;
        }
      }

      // Breadcrumb navigation in path bar
      document.getElementById("path-bar").addEventListener("click", (e) => {
        const nav = e.target.dataset?.nav;
        if (nav !== undefined) listDir(nav);
      });

      document.getElementById("file-list").addEventListener("click", (e) => {
        const row = e.target.closest(".file-row");
        if (!row) return;
        if (row.dataset.dir === "true") {
          listDir(row.dataset.path);
        } else {
          send("openFile", { path: row.dataset.path });
          send("showToast", {
            message: "Opening " + row.dataset.name,
            kind: "info",
            duration: 2000,
          });
        }
      });

      window.addEventListener("message", (e) => {
        if (e.source !== hostWindow) return;
        const d = e.data;
        if (!d) return;
        if (d.panelId && panelId && d.panelId !== panelId) return;
        if (d.type === "taiku:init") {
          // Sandboxed with an opaque origin, the panel inherits no CSS from the
          // app, so the host sends its design tokens as data instead.
          for (const [name, value] of Object.entries(d.theme?.tokens || {})) {
            document.documentElement.style.setProperty(name, value);
          }
          pluginId = d.pluginId;
          panelId = d.panelId || "";
          authToken = d.authToken || "";
          listDir(".");
        }
      });

      // The app's theme changed while this panel was open: the host sends the
      // whole token set again, to be applied as at init.
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:theme")
          return;
        for (const [name, value] of Object.entries(
          e.data.theme?.tokens || {},
        )) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    </script>
  </body>
</html>
