<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: rgb(var(--tk-bg, 10 10 12));
        color: rgb(var(--tk-ink-secondary, 205 208 214));
        font-family:
          Helvetica, "Helvetica Neue", "Nimbus Sans", Arial, sans-serif;
        font-size: 11px;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        flex-shrink: 0;
        background: rgb(var(--tk-bg, 10 10 12));
        border-bottom: 1px solid rgb(var(--tk-line, 38 38 43));
        padding: 4px 8px;
        display: flex;
        gap: 4px;
        align-items: center;
        z-index: 1;
        /* WRAP, don't scroll. Eleven category chips do not fit the panel in its
           docked width (measured 338px), and with `overflow-x: auto` plus a
           hidden scrollbar the row was simply cut off mid-word - "Terminal"
           through "Plugin" were unreachable with no affordance saying they
           existed. Wrapping costs one row of height and makes every filter
           visible at any width. */
        flex-wrap: wrap;
        row-gap: 4px;
      }
      .toolbar::-webkit-scrollbar {
        display: none;
      }
      .toolbar button {
        background: rgb(var(--tk-surface-2, 32 32 37));
        border: 1px solid rgb(var(--tk-line-strong, 64 64 72));
        color: rgb(var(--tk-ink-secondary, 205 208 214));
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .toolbar button:hover {
        background: rgb(var(--tk-surface-3, 44 44 50));
        color: rgb(var(--tk-ink, 244 244 245));
      }
      .toolbar button.active {
        background: rgb(var(--tk-accent-fill, 26 95 191));
        border-color: rgb(var(--tk-accent, 46 143 255));
        color: rgb(var(--tk-ink, 244 244 245));
      }
      .sep {
        width: 1px;
        height: 14px;
        background: rgb(var(--tk-line-strong, 64 64 72));
        margin: 0 2px;
      }
      .count {
        color: rgb(var(--tk-ink-muted, 139 139 150));
        font-size: 10px;
        margin-left: auto;
      }
      #log {
        padding: 4px 0;
        flex: 1;
        overflow-y: auto;
      }
      .entry {
        padding: 3px 8px;
        border-bottom: 1px solid rgb(var(--tk-line-soft, 30 30 35));
        display: flex;
        gap: 6px;
        align-items: baseline;
        font-family: ui-monospace, monospace;
      }
      .entry:hover {
        background: rgb(var(--tk-surface-1, 22 22 25));
      }
      .entry.hidden {
        display: none;
      }
      .ts {
        color: rgb(var(--tk-ink-faint, 82 82 91));
        flex-shrink: 0;
        font-size: 10px;
      }
      .badge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 3px;
        flex-shrink: 0;
        text-transform: uppercase;
        font-weight: 600;
      }
      .badge.terminal {
        background: color-mix(
          in srgb,
          rgb(var(--tk-accent, 46 143 255)) 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: rgb(var(--tk-accent, 46 143 255));
      }
      .badge.agent {
        background: color-mix(
          in srgb,
          rgb(var(--tk-info, 167 139 250)) 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: rgb(var(--tk-info, 167 139 250));
      }
      .badge.user {
        background: color-mix(
          in srgb,
          rgb(var(--tk-ok, 74 222 128)) 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: rgb(var(--tk-ok, 74 222 128));
      }
      .badge.shell {
        background: color-mix(
          in srgb,
          #fb923c 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #fb923c var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.plugin {
        background: color-mix(
          in srgb,
          #38bdf8 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #38bdf8 var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.tunnel {
        background: color-mix(
          in srgb,
          #fb7185 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #fb7185 var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.layout {
        background: color-mix(
          in srgb,
          #86efac 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #86efac var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.tile {
        background: color-mix(
          in srgb,
          #fde68a 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #fde68a var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.workspace {
        background: color-mix(
          in srgb,
          #93c5fd 18%,
          rgb(var(--tk-surface-1, 22 22 25))
        );
        color: color-mix(
          in srgb,
          #93c5fd var(--tk-hue-mix, 100%),
          rgb(var(--tk-ink, 244 244 245))
        );
      }
      .badge.default {
        background: rgb(var(--tk-surface-2, 32 32 37));
        color: rgb(var(--tk-ink-secondary, 205 208 214));
      }
      .data {
        color: rgb(var(--tk-ink, 244 244 245));
        word-break: break-all;
      }
      .empty {
        color: rgb(var(--tk-ink-faint, 82 82 91));
        text-align: center;
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="clear">Clear</button>
      <label
        style="
          color: rgb(var(--tk-ink-muted, 139 139 150));
          font-size: 10px;
          display: flex;
          align-items: center;
          gap: 3px;
        "
        ><input
          type="checkbox"
          id="auto"
          checked
          style="accent-color: rgb(var(--tk-accent, 46 143 255))"
        />
        Auto</label
      >
      <div class="sep"></div>
      <button class="filter active" data-cat="all">All</button>
      <button class="filter" data-cat="agent">Agent</button>
      <button class="filter" data-cat="user">User</button>
      <button class="filter" data-cat="shell">Shell</button>
      <button class="filter" data-cat="terminal">Terminal</button>
      <button class="filter" data-cat="layout">Layout</button>
      <button class="filter" data-cat="tile">Tile</button>
      <button class="filter" data-cat="workspace">Workspace</button>
      <button class="filter" data-cat="plugin">Plugin</button>
      <span class="count" id="count">0 events</span>
    </div>
    <div id="log"></div>
    <p id="empty" class="empty">Waiting for events...</p>
    <script>
      // The host hands this document a port with init. Requests go on it,
      // and its answers and events come back on it, re-dispatched here as the
      // host's messages: a port reaches only the document that received it.
      let taikuPort = null;
      function taikuPost(msg) {
        if (taikuPort) taikuPort.postMessage(msg);
        else window.parent.postMessage(msg, "*");
      }
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:init") return;
        const port = e.ports && e.ports[0];
        if (!port) return;
        if (taikuPort) taikuPort.close();
        taikuPort = port;
        // Events move to the port from here on, before any request.
        port.postMessage({ type: "taiku:port-ready" });
        port.onmessage = (ev) => {
          if (ev.data?.type === "taiku:init") return;
          window.dispatchEvent(
            new MessageEvent("message", {
              data: ev.data,
              source: window.parent,
            }),
          );
        };
      });
      const log = document.getElementById("log"),
        empty = document.getElementById("empty"),
        countEl = document.getElementById("count");
      const autoEl = document.getElementById("auto");
      let count = 0,
        activeFilter = "all",
        pluginId = "",
        panelId = "",
        authToken = "",
        reqId = 0;
      const hostWindow = window.parent;

      // Dedup: track last event fingerprint per type to suppress identical consecutive events.
      const lastEventKey = new Map();

      function updateCount() {
        const visible =
          activeFilter === "all"
            ? count
            : log.querySelectorAll(`.entry:not(.hidden)`).length;
        const total = count;
        countEl.textContent =
          activeFilter === "all"
            ? `${total} event${total === 1 ? "" : "s"}`
            : `${visible}/${total} events`;
      }

      function send(method, params) {
        if (!pluginId) return;
        taikuPost({
          type: "taiku:request",
          id: "el_" + ++reqId,
          pluginId,
          panelId,
          authToken,
          method,
          params,
        });
      }

      document.getElementById("clear").onclick = () => {
        log.innerHTML = "";
        count = 0;
        countEl.textContent = "0 events";
        empty.style.display = "";
        lastEventKey.clear();
      };

      document.querySelectorAll(".filter").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          activeFilter = btn.dataset.cat;
          log.querySelectorAll(".entry").forEach((el) => {
            el.classList.toggle(
              "hidden",
              activeFilter !== "all" && el.dataset.cat !== activeFilter,
            );
          });
          updateCount();
          // Re-apply autoscroll. Changing the filter changes which rows are
          // visible, but scrollTop stays where the old set left it - so
          // switching back to All landed on whatever happened to be at that
          // offset, often events from minutes earlier, while the newest rows
          // sat below the fold. Autoscroll only ran when a new event arrived.
          if (autoEl.checked) log.scrollTop = log.scrollHeight;
        });
      });

      function classify(t) {
        if (t.startsWith("agent.")) return "agent";
        if (t.includes("agent")) return "agent";
        // No "chat" category: this plugin does not hold `chat.read`, so the
        // host no longer delivers chat events to it (they carry message
        // bodies, and the pull twin `getChat` has always required that
        // permission). Categorising for an event that cannot arrive would
        // leave a filter tab that is permanently empty.
        if (t.includes("user")) return "user";
        if (t.includes("shell") && !t.includes("terminal")) return "shell";
        if (t.includes("terminal")) return "terminal";
        if (t.includes("layout")) return "layout";
        if (t.includes("tile")) return "tile";
        if (t.includes("workspace")) return "workspace";
        // No "tunnel" category either: `tunnel_changed` is the only tunnel
        // event and it now needs `tunnel.read` (it carries the port list),
        // which this plugin does not hold.
        if (t.includes("plugin")) return "plugin";
        return "default";
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      /** Format event data into a human-readable string. */
      function formatData(type, data) {
        if (!data || Object.keys(data).length === 0) return "";

        // User events — show device info
        if (type === "user_joined") {
          let s = esc(data.userName || "?");
          if (data.device)
            s += ` <span style="color:rgb(var(--tk-ink-muted, 139 139 150))">(${esc(data.device)})</span>`;
          if (data.canWrite === false)
            s += ` <span style="color:rgb(var(--tk-ink-faint, 82 82 91))">read-only</span>`;
          return s;
        }
        if (type === "user_left") {
          let s = esc(data.userName || `User ${data.userId ?? "?"}`);
          if (data.device)
            s += ` <span style="color:rgb(var(--tk-ink-muted, 139 139 150))">(${esc(data.device)})</span>`;
          return s;
        }
        if (type === "user_focused") {
          let s = esc(data.userName || "?");
          if (data.device)
            s += ` <span style="color:rgb(var(--tk-ink-muted, 139 139 150))">(${esc(data.device)})</span>`;
          s += ` → Shell #${data.focus ?? "?"}`;
          return s;
        }
        if (type === "user_unfocused") {
          let s = esc(data.userName || "?");
          if (data.device)
            s += ` <span style="color:rgb(var(--tk-ink-muted, 139 139 150))">(${esc(data.device)})</span>`;
          s += ` unfocused`;
          if (data.previousFocus != null) s += ` Shell #${data.previousFocus}`;
          return s;
        }

        // Agent events — format based on sub-type
        if (type.startsWith("agent.")) {
          const sub = type.slice(6); // strip "agent." prefix
          const sid = data.agentSessionId
            ? data.agentSessionId.slice(0, 8)
            : "";
          const agent = data.agent || "";
          const prefix = sid
            ? `<span style="color:rgb(var(--tk-ink-muted, 139 139 150))">${esc(agent)} ${sid}</span> `
            : "";

          if (sub === "user_message")
            return prefix + esc((data.text || "").slice(0, 150));
          if (sub === "assistant_message")
            return prefix + esc((data.text || "").slice(0, 150));
          if (sub === "thinking")
            return (
              prefix +
              `<span style="color:rgb(var(--tk-info, 167 139 250))">thinking</span> ${esc(
                (data.text || "").slice(0, 80),
              )}`
            );
          if (sub === "tool_call")
            return (
              prefix +
              `<span style="color:rgb(var(--tk-accent, 46 143 255))">${esc(data.tool_name || "?")}</span>`
            );
          if (sub === "tool_result")
            return (
              prefix +
              `${
                data.is_error
                  ? '<span style="color:rgb(var(--tk-danger, 248 113 113))">error</span>'
                  : "ok"
              } ${esc((data.output || "").slice(0, 80))}`
            );
          if (sub === "token_usage") {
            const cost =
              data.cost != null ? `$${Number(data.cost).toFixed(4)}` : "";
            return (
              prefix +
              `in:${data.input ?? 0} out:${data.output ?? 0} cached:${
                data.cached ?? 0
              } ${cost}`
            );
          }
          if (sub === "session_start")
            return (
              prefix +
              `model=${esc(data.model || "?")} v${esc(data.version || "?")}`
            );
          if (sub === "session_end")
            return (
              prefix +
              `${
                data.duration_ms
                  ? (data.duration_ms / 1000).toFixed(1) + "s"
                  : "ended"
              }`
            );
          if (sub === "turn_complete")
            return (
              prefix +
              `${
                data.duration_ms
                  ? (data.duration_ms / 1000).toFixed(1) + "s"
                  : "done"
              }`
            );
          if (sub === "file_change")
            return (
              prefix + `${esc(data.action || "?")} ${esc(data.path || "")}`
            );
          if (sub === "interrupt")
            return (
              prefix +
              `<span style="color:rgb(var(--tk-warn, 252 211 77))">interrupted</span>${
                data.tool_name ? " " + esc(data.tool_name) : ""
              }`
            );
          return prefix + JSON.stringify(data).slice(0, 150);
        }

        // Shells
        if (type === "shells_changed") {
          return data.count != null
            ? `${data.count} shell(s)`
            : JSON.stringify(data).slice(0, 100);
        }

        // Default: compact JSON
        return esc(JSON.stringify(data).slice(0, 200));
      }

      window.addEventListener("message", (e) => {
        if (e.source !== hostWindow) return;
        const d = e.data;
        if (!d) return;
        if (d.panelId && panelId && d.panelId !== panelId) return;
        if (d.type === "taiku:init") {
          // Sandboxed with an opaque origin, the panel inherits no CSS from the
          // app, so the host sends its design tokens as data instead.
          for (const [name, value] of Object.entries(d.theme?.tokens || {})) {
            document.documentElement.style.setProperty(name, value);
          }
          pluginId = d.pluginId;
          panelId = d.panelId || "";
          authToken = d.authToken || "";
          send("subscribeEvents");
          return;
        }
        if (d.type !== "taiku:event") return;
        const ev = d.event;

        // Deduplicate: skip if identical event type + data as the last one of this type.
        const dataKey = JSON.stringify(ev.data || {});
        const fingerprint = ev.type + ":" + dataKey;
        if (lastEventKey.get(ev.type) === fingerprint) return;
        lastEventKey.set(ev.type, fingerprint);

        empty.style.display = "none";
        const cat = classify(ev.type);
        const ts = new Date(ev.timestamp || Date.now());
        const time = ts.toLocaleTimeString("en", {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        const div = document.createElement("div");
        div.className = "entry";
        div.dataset.cat = cat;
        if (activeFilter !== "all" && cat !== activeFilter)
          div.classList.add("hidden");
        const formatted = formatData(ev.type, ev.data);
        div.innerHTML = `<span class="ts">${time}</span><span class="badge ${cat}">${esc(
          ev.type,
        )}</span><span class="data">${formatted}</span>`;
        log.appendChild(div);
        count++;
        updateCount();
        if (autoEl.checked) log.scrollTop = log.scrollHeight;
      });

      // The app's theme changed while this panel was open: the host sends the
      // whole token set again, to be applied as at init.
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:theme")
          return;
        for (const [name, value] of Object.entries(
          e.data.theme?.tokens || {},
        )) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    </script>
  </body>
</html>
