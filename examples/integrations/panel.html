<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: rgb(var(--tk-bg, 10 10 12));
        color: rgb(var(--tk-ink-secondary, 205 208 214));
        font-family:
          Helvetica, "Helvetica Neue", "Nimbus Sans", Arial, sans-serif;
        font-size: 12px;
        padding: 10px;
        height: 100vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgb(var(--tk-ink-muted, 139 139 150));
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgb(var(--tk-ink-faint, 82 82 91));
        flex-shrink: 0;
      }
      .dot.active {
        background: rgb(var(--tk-ok, 74 222 128));
      }
      .dot.pending {
        background: rgb(var(--tk-warn, 252 211 77));
      }
      .btn {
        border: 1px solid rgb(var(--tk-line-strong, 64 64 72));
        background: rgb(var(--tk-surface-2, 32 32 37));
        color: rgb(var(--tk-ink, 244 244 245));
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
      }
      .btn:hover {
        background: rgb(var(--tk-surface-3, 44 44 50));
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-primary {
        background: rgb(var(--tk-accent-fill, 26 95 191));
        border-color: rgb(var(--tk-accent-fill, 26 95 191));
        color: white;
      }
      .btn-primary:hover {
        background: rgb(var(--tk-accent-fill-strong, 28 77 148));
      }
      select,
      textarea {
        background: rgb(var(--tk-bg, 10 10 12));
        border: 1px solid rgb(var(--tk-line-strong, 64 64 72));
        color: rgb(var(--tk-ink, 244 244 245));
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 4px;
        outline: none;
        width: 100%;
        font-family: ui-monospace, monospace;
      }
      select:focus,
      textarea:focus {
        border-color: rgb(var(--tk-accent, 46 143 255));
      }
      textarea {
        resize: vertical;
        min-height: 48px;
      }
      .link {
        color: rgb(var(--tk-accent, 46 143 255));
        text-decoration: underline;
        word-break: break-all;
        font-size: 11px;
      }
      .output {
        background: rgb(var(--tk-bg, 10 10 12));
        border: 1px solid rgb(var(--tk-line, 38 38 43));
        border-radius: 4px;
        padding: 8px;
        font-family: ui-monospace, monospace;
        font-size: 10.5px;
        color: rgb(var(--tk-ink, 244 244 245));
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 240px;
        overflow-y: auto;
      }
      .muted {
        color: rgb(var(--tk-ink-faint, 82 82 91));
        font-style: italic;
      }
      .row {
        display: flex;
        gap: 6px;
      }
      .row > * {
        flex: 1;
      }
      hr {
        border: none;
        border-top: 1px solid rgb(var(--tk-line, 38 38 43));
      }
    </style>
  </head>
  <body>
    <div class="section">
      <span class="label">GitHub connection</span>
      <div class="status-row">
        <span class="dot" id="dot"></span>
        <span id="status">Checking…</span>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="connect">Connect GitHub</button>
        <button class="btn" id="refresh">Refresh</button>
      </div>
      <div id="connect-hint"></div>
    </div>

    <hr />

    <div class="section">
      <span class="label">Tool</span>
      <select id="tools">
        <option disabled selected>Load tools first</option>
      </select>
      <div class="row">
        <button class="btn" id="load-tools">List tools</button>
        <button class="btn btn-primary" id="run">Run</button>
      </div>
      <span class="label">Arguments (JSON)</span>
      <textarea id="args" spellcheck="false" autocapitalize="off">{}</textarea>
    </div>

    <div class="section">
      <span class="label">Result</span>
      <div class="output" id="output">
        <span class="muted">No result yet.</span>
      </div>
    </div>

    <script>
      // The host hands this document a port with init. Requests go on it,
      // and its answers and events come back on it, re-dispatched here as the
      // host's messages: a port reaches only the document that received it.
      let taikuPort = null;
      function taikuPost(msg) {
        if (taikuPort) taikuPort.postMessage(msg);
        else window.parent.postMessage(msg, "*");
      }
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:init") return;
        const port = e.ports && e.ports[0];
        if (!port) return;
        if (taikuPort) taikuPort.close();
        taikuPort = port;
        // Events move to the port from here on, before any request.
        port.postMessage({ type: "taiku:port-ready" });
        port.onmessage = (ev) => {
          if (ev.data?.type === "taiku:init") return;
          window.dispatchEvent(
            new MessageEvent("message", {
              data: ev.data,
              source: window.parent,
            }),
          );
        };
      });
      const TOOLKIT = "github";
      let pluginId = "",
        panelId = "",
        authToken = "",
        reqId = 0;
      const hostWindow = window.parent;

      const el = (id) => document.getElementById(id);

      function send(method, params) {
        const id = "ig_" + ++reqId;
        taikuPost({
          type: "taiku:request",
          id,
          pluginId,
          panelId,
          authToken,
          method,
          params,
        });
        return id;
      }

      function sendAsync(method, params) {
        return new Promise((resolve, reject) => {
          const id = send(method, params);
          const handler = (e) => {
            if (e.source !== hostWindow) return;
            const d = e.data;
            if (d?.panelId && panelId && d.panelId !== panelId) return;
            if (d?.type === "taiku:response" && d.id === id) {
              window.removeEventListener("message", handler);
              if (d.error) reject(new Error(d.error));
              else resolve(d.result);
            }
          };
          window.addEventListener("message", handler);
          setTimeout(() => {
            window.removeEventListener("message", handler);
            reject(new Error("Timeout"));
          }, 20000);
        });
      }

      function toast(message, kind) {
        send("showToast", { message, kind: kind || "info" });
      }

      function setStatus(state, text) {
        el("dot").className = "dot" + (state ? " " + state : "");
        el("status").textContent = text;
      }

      async function refreshConnections() {
        setStatus("", "Checking…");
        el("connect-hint").innerHTML = "";
        try {
          const res = await sendAsync("integrations.list");
          const conn = (res?.connections || []).find(
            (c) => c.toolkit === TOOLKIT,
          );
          if (conn && /active/i.test(conn.status || "")) {
            setStatus("active", "Connected");
            el("connect").textContent = "Reconnect GitHub";
          } else if (conn) {
            setStatus("pending", "Pending: " + conn.status);
          } else {
            setStatus("", "Not connected");
          }
        } catch (err) {
          setStatus("", "Error: " + err.message);
        }
      }

      async function connect() {
        el("connect").disabled = true;
        el("connect-hint").innerHTML = "";
        try {
          const res = await sendAsync("integrations.connect", {
            toolkit: TOOLKIT,
          });
          if (res?.redirectUrl) {
            if (res.opened) {
              el("connect-hint").innerHTML =
                '<span class="muted">Complete the OAuth flow in the opened tab, then hit Refresh.</span>';
            } else {
              el("connect-hint").innerHTML =
                'Popup blocked — <a class="link" target="_blank" rel="noopener" href="' +
                res.redirectUrl +
                '">click here to connect</a>, then Refresh.';
            }
          } else {
            toast("No redirect URL returned", "error");
          }
        } catch (err) {
          toast("Connect failed: " + err.message, "error");
        } finally {
          el("connect").disabled = false;
        }
      }

      async function loadTools() {
        const sel = el("tools");
        sel.innerHTML = "<option disabled selected>Loading…</option>";
        try {
          const res = await sendAsync("integrations.tools", {
            toolkit: TOOLKIT,
            limit: 50,
          });
          const tools = res?.tools || [];
          if (!tools.length) {
            sel.innerHTML = "<option disabled selected>No tools</option>";
            return;
          }
          sel.innerHTML = "";
          for (const t of tools) {
            const opt = document.createElement("option");
            opt.value = t.slug;
            opt.textContent = t.slug;
            opt.title = t.description || "";
            sel.appendChild(opt);
          }
        } catch (err) {
          sel.innerHTML =
            "<option disabled selected>Error: " + err.message + "</option>";
        }
      }

      async function run() {
        const action = el("tools").value;
        if (!action) {
          toast("Pick a tool first", "error");
          return;
        }
        let args;
        try {
          args = JSON.parse(el("args").value || "{}");
        } catch {
          toast("Arguments must be valid JSON", "error");
          return;
        }
        el("run").disabled = true;
        el("output").textContent = "Running " + action + "…";
        try {
          const res = await sendAsync("integrations.execute", {
            toolkit: TOOLKIT,
            action,
            arguments: args,
          });
          el("output").textContent = JSON.stringify(res, null, 2);
        } catch (err) {
          el("output").textContent = "Error: " + err.message;
        } finally {
          el("run").disabled = false;
        }
      }

      el("connect").addEventListener("click", connect);
      el("refresh").addEventListener("click", refreshConnections);
      el("load-tools").addEventListener("click", loadTools);
      el("run").addEventListener("click", run);

      window.addEventListener("message", (e) => {
        if (e.source !== hostWindow) return;
        const d = e.data;
        if (!d) return;
        if (d.panelId && panelId && d.panelId !== panelId) return;
        if (d.type === "taiku:init") {
          // Sandboxed with an opaque origin, the panel inherits no CSS from the
          // app, so the host sends its design tokens as data instead.
          for (const [name, value] of Object.entries(d.theme?.tokens || {})) {
            document.documentElement.style.setProperty(name, value);
          }
          pluginId = d.pluginId;
          panelId = d.panelId || "";
          authToken = d.authToken || "";
          refreshConnections();
        }
      });

      // The app's theme changed while this panel was open: the host sends the
      // whole token set again, to be applied as at init.
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent || e.data?.type !== "taiku:theme")
          return;
        for (const [name, value] of Object.entries(
          e.data.theme?.tokens || {},
        )) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    </script>
  </body>
</html>
